apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      containers:
      - name: guestbook
        image: rodrigocasio/guestbook-py:v2
        resources:
          requests:
            cpu: 2m
          limits:
            cpu: 5m
        ports:
        - containerPort: 3000
