apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
  namespace: guestbook-go-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      containers:
      - name: guestbook
        image: rodrigocasio/guestbook-go:v1 
        resources:
          requests:
            cpu: "20m"
          limits:
            cpu: "50m"
        ports:
        - containerPort: 3000
